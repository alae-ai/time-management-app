services:
  tm:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    environment:
      - TM_HOST
      - TM_PORT
      - TM_DATA_DIR
      - TM_DB_PATH
      - TM_API_URL
      - TZ
      - TM_LLM_BASE_URL
      - TM_LLM_API_KEY
      - TM_LLM_MODEL
      - TM_SESSION_DAYS
      - TM_COOKIE_SECURE
      - TM_SETUP_TOKEN
      - TM_PUBLIC_ORIGIN
      - TM_API_TOKEN
    expose:
      - "4317"
    volumes:
      - tm_data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.getenv('TM_PORT', '4317') + '/api/health', timeout=4)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    # Dokploy routes https://calendar.naoufalelouahabi.com to this service on port 4317.
    # Uncomment only for direct local access; Dokploy uses the internal exposed port.
    # ports:
    #   - "4317:4317"

volumes:
  tm_data:
